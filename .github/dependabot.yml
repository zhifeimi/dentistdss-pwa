version: 2
updates:
  # package.json is retained only as Deno's npm dependency manifest. npm and
  # Node.js are not used by local development, CI, or deployment.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
