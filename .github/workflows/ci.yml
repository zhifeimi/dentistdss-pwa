name: Frontend CI

on:
  pull_request:
  push:
    branches:
      - main
      - dev

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Deno 2.9.2
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.9.2

      - name: Verify locked dependencies
        run: deno install --frozen --node-modules-dir=none

      - name: Audit dependencies
        run: deno task audit

      - name: Check formatting, lint, and types
        run: deno task check

      - name: Run tests
        run: deno task test

      - name: Build production bundle
        env:
          VITE_API_HOST: ""
          VITE_GOOGLE_CLIENT_ID: test-client-id
          VITE_GOOGLE_MAPS_API_KEY: test-maps-key
        run: deno task build

      - name: Confirm repository stays node_modules-free
        run: test ! -e node_modules

  vercel-contract:
    name: Validate Vercel contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Validate Vercel configuration
        run: >-
          jq --exit-status
          '.framework == "vite" and
          .installCommand == "sh scripts/install-deno.sh" and
          .buildCommand == "./.deno/bin/deno task build" and
          .outputDirectory == "build"'
          vercel.json
