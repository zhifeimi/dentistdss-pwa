name: Frontend CI

on:
  pull_request:
  push:
    branches:
      - main
      - dev

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm exec tsc -- --noEmit

      - name: Run tests
        run: npm test -- --run

      - name: Build production bundle
        env:
          VITE_API_HOST: ""
          VITE_GOOGLE_CLIENT_ID: test-client-id
          VITE_GOOGLE_MAPS_API_KEY: test-maps-key
        run: npm run build

  vercel-contract:
    name: Validate Vercel contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Validate Vercel configuration
        run: jq --exit-status '.framework == "vite" and .outputDirectory == "build"' vercel.json
